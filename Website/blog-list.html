<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stories - We The Explorers</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #FAFAF7;
            color: #2C2C2C;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .list-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        .story-card {
            background: #FFFFFF;
            border: 1px solid #E2E2D9;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
            text-decoration: none;
            display: block;
            color: inherit;
            transition: transform 0.2s, border-color 0.2s;
        }
        .story-card:hover {
            transform: translateY(-3px);
            border-color: #8B3A3A;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }
        .story-title {
            color: #8B3A3A;
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0 0 8px 0;
        }
    </style>
</head>
<body>

    <!-- Floating Navigation Menu -->
    <nav style="background-color: #FAFAF7; padding: 15px; text-align: center; border-bottom: 1px solid #E2E2D9; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);">
        <a href="/" style="margin-right: 25px; text-decoration: none; color: #8B3A3A; font-weight: 800; font-size: 1.1rem;">HOME</a>
        <a href="/blog-list.html" style="text-decoration: none; color: #8B3A3A; font-weight: 800; font-size: 1.1rem;">STORIES</a>
    </nav>

    <div class="list-container">
        <h1 style="color: #8B3A3A; text-align: center; margin-bottom: 30px; font-weight: 900; letter-spacing: 1px;">LATEST EXPERIENCES</h1>
        <div id="stories-list">
            <p style="text-align: center; color: #707070;">Loading latest stories...</p>
        </div>
    </div>

    <!-- Script to fetch the list of stories directly from your GitHub folder -->
    <script>
        // ⚠️ REPLACE THESE TWO LINES WITH YOUR GITHUB DETAILS ⚠️
        const githubUsername = "pratishpreman-del"; // Example: "pratish-explorer"
        const githubRepo = "TheyyamSearch";           // Example: "kannur-website"
        
        async function fetchStories() {
            try {
                // This asks GitHub for a list of all files inside your blog-posts folder
                const response = await fetch(`https://api.github.com/repos/${githubUsername}/${githubRepo}/contents/Website/blog-posts`);
                if (!response.ok) throw new Error('Could not fetch posts folder');
                
                const files = await response.json();
                let htmlContent = "";
                
                const markdownFiles = files.filter(file => file.name.endsWith('.md'));
                markdownFiles.reverse(); // Show newest dates first
                
                if (markdownFiles.length === 0) {
                    htmlContent = "<p style='text-align:center;'>No stories published yet. Check back soon!</p>";
                } else {
                    markdownFiles.forEach(file => {
                        // Extract the filename to create the link
                        const slug = file.name.replace('.md', '');
                        
                        // Clean up the CMS name (2026-06-13-exploring-kannur -> EXPLORING KANNUR)
                        const cleanName = slug.split('-').slice(3).join(' ').toUpperCase();
                        const dateStr = slug.split('-').slice(0, 3).join('-');

                        htmlContent += `
                            <a href="/blog.html?post=${slug}" class="story-card">
                                <h2 class="story-title">${cleanName || "Read Story"}</h2>
                                <span style="color: #707070; font-size: 0.9rem; font-weight: 600;">📅 ${dateStr}</span>
                            </a>
                        `;
                    });
                }
                
                document.getElementById('stories-list').innerHTML = htmlContent;
                
            } catch (error) {
                document.getElementById('stories-list').innerHTML = "<p style='text-align:center;'>Could not load stories. Ensure you have published a post via the Decap CMS dashboard.</p>";
                console.error(error);
            }
        }
        
        fetchStories();
    </script>
</body>
</html>
